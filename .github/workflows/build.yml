name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube Analysis & Notification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=false

      - name: Send Detailed Slack Alert
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          KEY="ayesha752_sonar-lab"
          ORG="ayesha752"
          
          # Fetch Quality Gate Status
          GATE_JSON=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$KEY")
          GATE=$(echo "$GATE_JSON" | jq -r '.projectStatus.status // "UNKNOWN"')
          
          # Fetch Specific Issue Types
          BUGS_JSON=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?organization=$ORG&projects=$KEY&types=BUG&resolved=false")
          TOTAL_BUGS=$(echo "$BUGS_JSON" | jq -r '.total // 0')

          VULN_JSON=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?organization=$ORG&projects=$KEY&types=VULNERABILITY&resolved=false")
          TOTAL_VULNS=$(echo "$VULN_JSON" | jq -r '.total // 0')

          HOTSPOTS_JSON=$(curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/hotspots/search?projectKey=$KEY&status=TO_REVIEW")
          TOTAL_HOTSPOTS=$(echo "$HOTSPOTS_JSON" | jq -r '.paging.total // 0')

          if [ "$GATE" = "OK" ]; then
            COLOR="#2EB886"
            STATUS_EMOJI=":white_check_mark: PASSED"
          else
            COLOR="#A30200"
            STATUS_EMOJI=":x: FAILED"
          fi

          PAYLOAD=$(jq -n \
            --arg actor "${{ github.actor }}" \
            --arg repo "${{ github.repository }}" \
            --arg sha "${{ github.sha }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg gate "$STATUS_EMOJI" \
            --arg bugs "$TOTAL_BUGS" \
            --arg vulns "$TOTAL_VULNS" \
            --arg hotspots "$TOTAL_HOTSPOTS" \
            --arg color "$COLOR" \
            --arg dash "https://sonarcloud.io/dashboard?id=$KEY" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              attachments: [{
                color: $color,
                blocks: [
                  {
                    type: "section",
                    text: { type: "mrkdwn", text: ("*SonarQube Scan Result for " + $repo + "*") }
                  },
                  {
                    type: "section",
                    fields: [
                      { type: "mrkdwn", text: ("*Pushed By:*\n" + $actor) },
                      { type: "mrkdwn", text: ("*Branch:*\n" + $branch) },
                      { type: "mrkdwn", text: ("*Commit:*\n`" + $sha[0:7] + "`") },
                      { type: "mrkdwn", text: ("*Quality Gate:*\n" + $gate) }
                    ]
                  },
                  {
                    type: "section",
                    fields: [
                      { type: "mrkdwn", text: ("*Bugs:* " + $bugs) },
                      { type: "mrkdwn", text: ("*Vulnerabilities:* " + $vulns) },
                      { type: "mrkdwn", text: ("*Security Hotspots:* " + $hotspots) }
                    ]
                  },
                  {
                    type: "actions",
                    elements: [
                      { type: "button", text: { type: "plain_text", text: "View Dashboard" }, url: $dash },
                      { type: "button", text: { type: "plain_text", text: "View Pipeline Run" }, url: $run }
                    ]
                  }
                ]
              }]
            }')

          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
